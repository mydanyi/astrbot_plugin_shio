name: astrbot_plugin_shio
display_name: 星汐
desc: 为 AstrBot 构筑 typed 数字仿生人格群聊心智回路：可信身份、自然参与、多模态、人格情绪、受控检索与默认关闭的主人动作。
short_desc: 让数字仿生人格从群聊的星潮中醒来。
help: 先在测试群核对人格、权限与插件组合。主人名单只表示动作资格，四个动作适配器默认关闭；普通用户仅保留精确白名单中的只读资料工具。请勿同时启用独立的 astrbot_plugin_agent_guard。
version: 0.5.14
author: "Danyi"
repo: "https://github.com/mydanyi/astrbot_plugin_shio"
astrbot_version: ">=4.26.7,<5"
support_platforms:
  - aiocqhttp
