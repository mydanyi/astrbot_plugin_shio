<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星汐 Shio · 设置</title>
<link rel="icon" href="./assets/logo.png">
<link rel="stylesheet" href="./style.css">
</head>
<body class="layout-a">
<a class="skip" href="#main">跳到主要内容</a>
<div class="shell">
<header class="masthead">
<div class="brand">
<img class="logo logo-official" src="./assets/logo.png" alt="星汐 Shio 官方标识" width="58" height="58">
<div><h1>星汐 Shio <span class="ver" id="pluginVersion"></span></h1><p>自然聊天设置</p></div>
</div>
<div class="controls">
<span class="theme-pick"><label for="visualStyleSelect">主题</label><select id="visualStyleSelect" aria-label="主题"><option value="native" selected>原生清爽</option><option value="mist">星雾玻璃</option><option value="midnight">深海夜航</option><option value="cream">奶油手账</option></select></span>
<button class="btn" type="button" id="themeBtn" aria-pressed="false">深色模式</button>
<span class="dirty clean" id="dirtyBadge"><span class="dot" aria-hidden="true"></span><span id="dirtyText">正在读取配置</span></span>
<button class="btn" type="button" id="discardBtn" disabled>放弃修改</button>
<button class="btn primary" type="button" id="saveBtn" disabled>保存</button>
</div>
</header>
<div class="searchbar">
<svg class="sicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21" stroke-linecap="round"/></svg>
<label class="sr-only" for="searchInput">搜索七页设置</label>
<input id="searchInput" type="search" placeholder="搜索七页标题、字段与提示，例如：审核、气泡、群号" autocomplete="off" aria-controls="searchResults" aria-expanded="false">
<div id="searchResults" class="results" hidden aria-live="polite" aria-label="搜索结果"></div>
</div>
<div class="workspace">
<aside class="sidebar" id="sidebar" aria-label="分区导航">
<div class="side-head"><span>分区导航 · 7</span><button type="button" class="closex" data-act="drawer-close" aria-label="关闭分区导航">×</button></div>
<nav class="navlist" id="navA"></nav>
</aside>
<div class="main-col">
<div class="mobile-bar"><button class="btn" type="button" id="drawerBtn" data-act="drawer-open" aria-expanded="false" aria-controls="sidebar">☰ 分区导航</button></div>
<nav class="tabs" id="navB" aria-label="顶部分区标签" hidden></nav>
<main id="main" tabindex="-1">
<div id="pageRoot"><p class="empty-note">正在读取配置…</p></div>
</main>
</div>
</div>
</div>
<div class="overlay" id="overlay" aria-hidden="true"></div>
<dialog id="ruleDialog" class="dialog" aria-labelledby="ruleTitle" aria-describedby="ruleHint">
<div class="dialog-inner">
<p class="eyebrow">规则全文 · 草稿内编辑</p>
<h2 id="ruleTitle">规则</h2>
<p class="pathline" id="rulePath"></p>
<p class="rulehint" id="ruleHint"></p>
<label for="ruleText">规则全文（可修改）</label>
<textarea id="ruleText" rows="12" spellcheck="false"></textarea>
<p class="empty-note" id="ruleEmpty"></p>
<p class="empty-note">取消或关闭窗口不会改变设置；应用到草稿后，仍需点击保存。</p>
<details class="default-box"><summary>查看默认规则全文</summary><pre id="ruleDefault"></pre></details>
<div class="dialog-foot"><button type="button" class="btn mini" id="ruleRestore">恢复默认</button><span class="spacer"></span><button type="button" class="btn" id="ruleCancel">取消</button><button type="button" class="btn primary" id="ruleApply">应用到草稿</button></div>
</div>
</dialog>
<div id="toast" role="status" aria-live="polite"><span id="toastMain"></span><span class="sub" id="toastSub"></span></div>
<script type="module" src="./theme.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
