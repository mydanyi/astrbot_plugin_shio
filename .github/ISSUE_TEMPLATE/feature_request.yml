name: 功能建议
description: 提议新的回复编排、表达检索、兼容性或配置能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 请描述当前行为为什么不足，不要只写功能名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法
  - type: textarea
    id: impact
    attributes:
      label: 对权限、Token、延迟和兼容性的影响
      description: 如果可能，请说明该功能是否会增加模型调用、开放新工具或改变其他插件流程。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 该建议不会要求把模型文本当作可信身份或权限依据。
          required: true

